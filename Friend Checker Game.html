<!DOCTYPE html>
<html>
    <head>
        <title>Friend Checker Game</title>
    </head>
    <body>
        <script>

            //User Input
            let userName= prompt("Input your name", "Maria");

            //Switch Cases
            switch(userName){
                case "Maria":
                    console.log("You are my friend.");
                    break;
                    case "Duncan":
                        console.log("Definitely my great ally");
                        break;
                        case "Prudence":
                            console.log("My greatest of all friends");
                            break;
                            case "Judie":
                                console.log("Quite an old friend");
                                break;
                                case "Antony":
                                    console.log("Oww, my amazing good friend");
                                    break;
                                    case "Emerson":
                                        console.log("Oh my! How can I forget him?");
                                        break;
                                        case "Jesus":
                                            console.log("The fairest of ten thousands to me!");
                                            break;
                                            default:
                                                console.log("Oops! I can do new friends anyway.");
            }
        </script>
    </body>
</html>
